  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function () {
        let thirdPartyLoaded = false;

        function loadThirdPartyScripts() {
          if (thirdPartyLoaded) return;
          thirdPartyLoaded = true;

          // 1. Tidio Chat Widget + Automated Font Preload Warning Suppressor
          const tidioScript = document.createElement("script");
          tidioScript.src = "//code.tidio.co/ldu1i1cyjp1ukolerdriocnmy3r2bpgc.js";
          tidioScript.async = true;
          
          // Fix: Intercept Tidio's font injection engine to stop unused .woff2 warnings
          tidioScript.onload = () => {
            const observer = new MutationObserver((mutations) => {
              mutations.forEach((mutation) => {
                mutation.addedNodes.forEach((node) => {
                  if (node.tagName === 'LINK' && node.rel === 'preload' && node.href.includes('fonts.tidio.co')) {
                    node.remove(); // Safely drop the aggressive background font preloader
                  }
                });
              });
            });
            observer.observe(document.head, { childList: true });
          };
          
          document.body.appendChild(tidioScript);

          // 2. Elfsight Widget Asset Pipeline Fix
          // (Changed from root home domain 'https://elfsight.com' which causes fetch blocks,
          // to their proper core edge CDN server runtime utility asset link)
          const elfsightScript = document.createElement("script");
          elfsightScript.src = "https://static.elfsight.com/platform/platform.js";
          elfsightScript.async = true;
          elfsightScript.defer = true;
          document.body.appendChild(elfsightScript);
        }

        // Execution Listeners (Scroll triggers, interaction handlers, and fallback timers)
        window.addEventListener("scroll", () => {
          const scrollPosition = window.scrollY + window.innerHeight;
          const pageHeight = document.documentElement.scrollHeight;
          if (pageHeight > 0 && scrollPosition / pageHeight > 0.75) {
            loadThirdPartyScripts();
          }
        }, { passive: true }); // passive increases scroll frames and drops layout shift blocks

        setTimeout(loadThirdPartyScripts, 3500); // Shifted to 3.5s to let core layout build flawlessly

        window.addEventListener("mousemove", loadThirdPartyScripts, { once: true });
        window.addEventListener("touchstart", loadThirdPartyScripts, { once: true });
      })();
    </script>
