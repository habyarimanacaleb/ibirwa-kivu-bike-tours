<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/bt-logo-52.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore the beauty of Lake Kivu with Ibirwa Bike Tours. Enjoy cycling adventures, cultural experiences, and scenic landscapes in Rwanda."
    />
    <meta
      name="keywords"
      content="Kivu, Bike Tours, Ibirwa, Adventure, Cycling, Tours, Kigali"
    />
    <meta name="author" content="Ibirwa Kivu Bike Tours" />

    <!-- FIX: Corrected Google Fonts CDN preconnect subdomains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <title>Ibirwa Kivu Bike Tours | Adventure Cycling in Rwanda</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function () {
        let thirdPartyLoaded = false;

        function loadThirdPartyScripts() {
          if (thirdPartyLoaded) return;
          thirdPartyLoaded = true;

          // 1. Tidio Chat Widget
          const tidioScript = document.createElement("script");
          tidioScript.src =
            "//code.tidio.co/ldu1i1cyjp1ukolerdriocnmy3r2bpgc.js";
          tidioScript.async = true;
          document.body.appendChild(tidioScript);

          // 2. SPEED FIX: Defer Elfsight widget injection to resolve browser tracking prevention stalls
          const elfsightScript = document.createElement("script");
          elfsightScript.src = "https://elfsight.com";
          elfsightScript.async = true;
          elfsightScript.defer = true;
          document.body.appendChild(elfsightScript);
        }

        // Load on scroll past 75%
        window.addEventListener("scroll", () => {
          const scrollPosition = window.scrollY + window.innerHeight;
          const pageHeight = document.documentElement.scrollHeight;
          if (pageHeight > 0 && scrollPosition / pageHeight > 0.75) {
            loadThirdPartyScripts();
          }
        });

        // Load after 2 seconds (delayed load so it doesn't block)
        setTimeout(loadThirdPartyScripts, 2000);

        // Load on first mouse move or touch start (user interaction)
        window.addEventListener("mousemove", loadThirdPartyScripts, {
          once: true,
        });
        window.addEventListener("touchstart", loadThirdPartyScripts, {
          once: true,
        });
      })();
    </script>
  </body>
</html>
